name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Every night, the integration test runs with the latest Claude Code, so a
  # client release that breaks Jalon shows within a day.
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Run gofmt -w on:"
            echo "$unformatted"
            exit 1
          fi

      - name: go.mod and go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Pinned to a commit: a tag of a third-party action can be moved.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14

      - name: Known vulnerabilities in the code paths used
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  # Claude Code updates an installed mod only when its version changes, so a
  # pull request that changes plugin/ must also change that version.
  plugin-version:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # HEAD is the merge commit; its first parent is the base branch.
          fetch-depth: 2
          persist-credentials: false

      - name: The mod's version changes with the mod
        run: |
          if git diff --quiet HEAD^1 HEAD -- plugin/; then exit 0; fi
          if git diff HEAD^1 HEAD -- plugin/.claude-plugin/plugin.json | grep -q '^+ *"version"'; then exit 0; fi
          echo "plugin/ changed: bump \"version\" in plugin/.claude-plugin/plugin.json"
          exit 1

  # The real Claude Code runs Jalon's hooks against a fake model API served by
  # the test: no key, no model. Pinned on pull requests, so a client release
  # never turns one red; the latest version at night.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLAUDE_CODE_VERSION: ${{ github.event_name == 'schedule' && 'latest' || '2.1.301' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install Claude Code
        run: |
          npm install --global "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
          claude --version

      - name: Integration test
        run: go test -tags e2e -count=1 ./cmd/jalon -run TestE2E
        env:
          JALON_E2E_REQUIRE: "1"
