version: "2"

# Without the tag, the e2e harness and its test are hidden from every linter.
run:
  build-tags:
    - e2e

# The standard linters (errcheck, govet, ineffassign, staticcheck, unused), plus
# gosec. The presets drop the usual noise, such as an unchecked error from a
# deferred Close.
linters:
  enable:
    - gosec
  settings:
    gosec:
      excludes:
        # errcheck already covers unhandled errors, with the same std
        # exclusions.
        - G104
  exclusions:
    presets:
      - std-error-handling
      - common-false-positives
    rules:
      # Test servers and fixtures ignore write errors on purpose.
      - path: _test\.go
        linters:
          - errcheck
          - gosec
