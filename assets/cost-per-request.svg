<svg xmlns="http://www.w3.org/2000/svg" width="640" height="340" viewBox="0 0 640 340" role="img" aria-labelledby="t d">
<title id="t">Average cost of one request by context size</title>
<desc id="d">0–100K: $0.064 over 799 requests; 100–200K: $0.063 over 1743 requests; 200–300K: $0.086 over 1136 requests; 300–400K: $0.116 over 238 requests; 400–500K: $0.222 over 52 requests. Real sessions of one week, Opus 5.5 API prices.</desc>
