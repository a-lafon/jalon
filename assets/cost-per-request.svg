<text x="16" y="24" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#0b0b0b">Average cost of one request, by context size</text>
<text x="16" y="42" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#52514e">3,968 requests from one week of real sessions, Opus 5.5 API prices.</text>
<text x="16" y="58" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#52514e">Subagents excluded. Each request re-reads the context and writes what it adds.</text>
