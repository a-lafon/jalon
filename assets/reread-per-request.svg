<text x="16" y="24" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#0b0b0b">Tokens re-read, request by request</text>
<text x="16" y="42" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#52514e">One conversation cut at about 300K tokens, same next three prompts.</text>
<text x="16" y="58" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#52514e">Every request re-reads the whole context: the steeper the line, the bigger the context.</text>
