<svg xmlns="http://www.w3.org/2000/svg" width="640" height="340" viewBox="0 0 640 340" role="img" aria-labelledby="t d">
<title id="t">Tokens re-read, request by request, in one conversation</title>
<desc id="d">One conversation cut at about 300K tokens, next three prompts. Full context: 12 requests of about 300K each, 3.7M in total. Plain /compact: the compaction request re-reads about 300K, then 4 requests of 20K to 56K, 0.43M in total. Jalon handoff: 8 requests of 8K to 52K, 0.16M in total.</desc>
